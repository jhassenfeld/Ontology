<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ontology</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  color: #fff;
  font-family: 'Source Sans 3', sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ════════════════════════════════════
   SCREEN SYSTEM — only one visible at a time
   ════════════════════════════════════ */
.screen {
  position: absolute; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
.screen.active {
  opacity: 1;
  pointer-events: auto;
}

/* ════════════════════════════════════
   SCREEN 1 — LANDING (retro menu)
   ════════════════════════════════════ */
#landing {
  flex-direction: column;
  gap: 3rem;
  padding: 2rem;
}

.landing-title {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(1rem, 3.5vw, 1.6rem);
  text-align: center;
  line-height: 2;
  text-shadow: 0 0 10px rgba(255,255,255,0.3);
}

.landing-menu {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}

.menu-item {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(0.6rem, 2vw, 0.85rem);
  background: none;
  border: none;
  color: #888;
  cursor: pointer;
  padding: 0.8rem 1.5rem;
  transition: color 0.15s ease, text-shadow 0.15s ease;
  position: relative;
  text-align: center;
  line-height: 1.8;
}

.menu-item:hover, .menu-item.selected {
  color: #fff;
  text-shadow: 0 0 8px rgba(255,255,255,0.4);
}

.menu-item::before {
  content: '';
  position: absolute;
  left: -1.5em;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0;
  transition: opacity 0.15s ease;
}

.menu-item:hover::before, .menu-item.selected::before {
  content: '▸';
  opacity: 1;
}

.landing-blink {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.65rem;
  color: #555;
  text-align: center;
  animation: blink 1.2s step-end infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ════════════════════════════════════
   SCREEN 2 — TYPEWRITER INTRO
   ════════════════════════════════════ */
#intro {
  flex-direction: column;
  padding: 2rem;
  overflow: hidden;
}

.intro-wrapper {
  max-width: 680px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding-right: 1rem;
}

.intro-wrapper::-webkit-scrollbar { width: 4px; }
.intro-wrapper::-webkit-scrollbar-track { background: transparent; }
.intro-wrapper::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

.intro-text {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(0.55rem, 1.5vw, 0.72rem);
  line-height: 2.4;
  color: #ccc;
  white-space: pre-wrap;
  word-wrap: break-word;
  transition: opacity 0.4s ease;
}

.intro-text .cursor {
  display: inline-block;
  width: 0.6em;
  height: 1.1em;
  background: #fff;
  vertical-align: text-bottom;
  animation: blink 0.7s step-end infinite;
  margin-left: 2px;
}

.intro-text em {
  color: #aaa;
  font-style: italic;
}

.intro-text strong {
  color: #fff;
  font-weight: 700;
}

.skip-btn {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  font-family: 'Press Start 2P', monospace;
  font-size: 0.6rem;
  background: none;
  border: 1px solid #444;
  color: #666;
  padding: 0.6rem 1.2rem;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
  z-index: 100;
}

.skip-btn:hover {
  color: #fff;
  border-color: #888;
}

.continue-btn {
  display: inline-block;
  font-family: 'Press Start 2P', monospace;
  font-size: 0.5rem;
  background: none;
  border: none;
  color: #555;
  cursor: pointer;
  padding: 0.6rem 0;
  margin-top: 0.8rem;
  transition: color 0.15s ease;
  animation: pulse 1.5s ease infinite;
}

.continue-btn:hover { color: #fff; }

@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* ════════════════════════════════════
   SCREEN 3 — CIRCLES
   ════════════════════════════════════ */
#circles-screen {
  overflow: hidden;
}

.app {
  position: absolute; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.app-header {
  position: absolute;
  top: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 20;
  transition: opacity 0.5s ease, transform 0.5s ease;
  pointer-events: none;
}

.app-header.hidden {
  opacity: 0;
  transform: translateX(-50%) translateY(-10px);
}

.app-header h1 {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(0.65rem, 2vw, 0.9rem);
  font-weight: 400;
  color: #aaa;
  text-shadow: 0 0 8px rgba(255,255,255,0.15);
}

.app-header p {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.5rem;
  color: #555;
  margin-top: 0.5rem;
}

/* Circles Container */
.circles-container {
  position: relative;
  width: min(80vmin, 520px);
  height: min(80vmin, 520px);
  transition: width 0.7s cubic-bezier(0.4,0,0.2,1),
              height 0.7s cubic-bezier(0.4,0,0.2,1);
}

.circles-container.expanded {
  width: 92vmin;
  height: 92vmin;
}

/* Rings */
.ring {
  position: absolute;
  border-radius: 50%;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  transition: width 0.7s cubic-bezier(0.4,0,0.2,1),
              height 0.7s cubic-bezier(0.4,0,0.2,1),
              opacity 0.4s ease,
              border-color 0.3s ease;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.ring:hover { border-width: 3px; }

.ring-label { display: none; }

/* External labels with connector lines */
#labels-svg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  overflow: visible;
}

.connector-line {
  stroke-width: 1;
  stroke-dasharray: 4 3;
  opacity: 0.4;
  transition: opacity 0.4s ease;
}

.connector-dot {
  opacity: 0.5;
  transition: opacity 0.4s ease;
}

.external-label {
  position: absolute;
  font-family: 'Press Start 2P', monospace;
  font-size: 0.55rem;
  white-space: nowrap;
  pointer-events: none;
  text-shadow: 0 0 6px currentColor;
  transition: top 0.7s cubic-bezier(0.4,0,0.2,1),
              left 0.7s cubic-bezier(0.4,0,0.2,1),
              opacity 0.4s ease;
}

.ring.inner-hidden {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease, width 0.7s cubic-bezier(0.4,0,0.2,1), height 0.7s cubic-bezier(0.4,0,0.2,1);
}

/* Detail inside active ring */
.detail-content {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  max-width: 500px;
  max-height: 76%;
  overflow-y: auto;
  pointer-events: none;
  opacity: 0;
  z-index: 15;
  transition: opacity 0.45s ease 0.25s;
  padding: 0.5rem;
}

.detail-content.visible {
  pointer-events: auto;
  opacity: 1;
}

.detail-content::-webkit-scrollbar { width: 4px; }
.detail-content::-webkit-scrollbar-track { background: transparent; }
.detail-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 99px;
  padding: 0.4rem 0.9rem 0.4rem 0.65rem;
  font-family: 'Press Start 2P', monospace;
  font-size: 0.45rem;
  cursor: pointer;
  margin-bottom: 0.75rem;
  transition: background 0.2s ease;
  color: inherit;
}

.back-btn:hover { background: rgba(0,0,0,0.6); }
.back-btn svg { width: 14px; height: 14px; }

.detail-content h2 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 0.35rem;
}

.detail-description {
  font-size: 0.82rem;
  font-weight: 300;
  opacity: 0.8;
  margin-bottom: 0.35rem;
  line-height: 1.55;
}

.detail-ontology {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.5rem;
  line-height: 2;
  margin-bottom: 0.75rem;
  padding: 0.5rem 0.7rem;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
}

.questions-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.4rem;
}

.questions-header h3 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.1rem;
  font-weight: 600;
}

.refresh-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  padding: 0.3rem 0.65rem;
  font-family: 'Press Start 2P', monospace;
  font-size: 0.4rem;
  cursor: pointer;
  transition: background 0.2s ease;
  color: inherit;
}

.refresh-btn:hover { background: rgba(0,0,0,0.5); }
.refresh-btn svg { width: 12px; height: 12px; }

.questions-list {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.question-card {
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 0.55rem 0.75rem;
  animation: fadeUp 0.3s ease both;
}

.question-card:nth-child(1) { animation-delay: 0.05s; }
.question-card:nth-child(2) { animation-delay: 0.1s; }
.question-card:nth-child(3) { animation-delay: 0.15s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.question-card .q-text {
  display: block;
  font-size: 0.9rem;
  font-weight: 500;
  line-height: 1.45;
  text-decoration: none;
  transition: opacity 0.2s;
}

.question-card .q-text:hover { text-decoration: underline; }

.question-card .q-text .q-icon {
  display: inline-block;
  width: 10px;
  height: 10px;
  opacity: 0.35;
  vertical-align: baseline;
  margin-left: 0.25rem;
}

/* Home button on circles screen */
.home-btn {
  position: fixed;
  bottom: 1.5rem;
  left: 1.5rem;
  font-family: 'Press Start 2P', monospace;
  font-size: 0.45rem;
  background: none;
  border: 1px solid #333;
  color: #555;
  padding: 0.5rem 0.9rem;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
  z-index: 100;
}

.home-btn:hover { color: #fff; border-color: #888; }

@media (max-width: 600px) {
  .landing-title { font-size: 0.8rem; }
  .menu-item { font-size: 0.55rem; }
  .detail-content h2 { font-size: 1.2rem; }
  .detail-content { max-height: 70%; }
  .detail-description { font-size: 0.78rem; }
  .external-label { font-size: 0.4rem; }
}
</style>
</head>

// ═══════════════════════════════════════
// TYPEWRITER (line-by-line with continue)
// ═══════════════════════════════════════
let introPageIndex = 0;
let introLineIndex = 0;
let introCharIndex = 0;
let introTyping = false;

function stopTypewriter() {
  if (typewriterTimer) { clearTimeout(typewriterTimer); typewriterTimer = null; }
  introTyping = false;
}

function startTypewriter() {
  const el = document.getElementById('intro-text');
  el.innerHTML = '';
  el.style.opacity = '1';
  introPageIndex = 0;
  introLineIndex = 0;
  introCharIndex = 0;
  introTyping = false;
  setTimeout(() => typeLine(), 400);
}

function typeLine() {
  const currentPage = INTRO_PAGES[introPageIndex];
  if (introLineIndex >= currentPage.length) {
    if (introPageIndex < INTRO_PAGES.length - 1) {
      advanceIntroPage();
    } else {
      showFinalPrompt();
    }
    return;
  }

  introTyping = true;
  introCharIndex = 0;
  const el = document.getElementById('intro-text');
  const wrapper = document.getElementById('intro-wrapper');
  const line = currentPage[introLineIndex];

  // Create a span for this line
  const lineSpan = document.createElement('span');
  lineSpan.className = 'intro-line';
  lineSpan.dataset.index = introLineIndex;

  // Add cursor
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  lineSpan.appendChild(cursor);

  el.appendChild(lineSpan);
  wrapper.scrollTop = wrapper.scrollHeight;

  const speed = 22;

  function typeChar() {
    if (introCharIndex < line.length) {
      const c = line[introCharIndex];
      lineSpan.insertBefore(document.createTextNode(c), cursor);
      introCharIndex++;
      wrapper.scrollTop = wrapper.scrollHeight;

      let delay = speed;
      if (c === '.' || c === '?') delay = speed * 5;
      else if (c === ',') delay = speed * 3;

      typewriterTimer = setTimeout(typeChar, delay);
    } else {
      // Line done — remove cursor, show continue button
      cursor.remove();
      introTyping = false;

      // Add line break after this line
      el.appendChild(document.createElement('br'));
      el.appendChild(document.createElement('br'));

      const currentPage = INTRO_PAGES[introPageIndex];
      const isLastLineOnPage = introLineIndex >= currentPage.length - 1;
      const isLastPage = introPageIndex >= INTRO_PAGES.length - 1;

      if (isLastLineOnPage && isLastPage) {
        showFinalPrompt();
      } else {
        showContinueBtn();
      }
    }
  }

  typewriterTimer = setTimeout(typeChar, 300);
}

function advanceIntroPage() {
  const el = document.getElementById('intro-text');
  el.style.opacity = '0';
  setTimeout(() => {
    el.innerHTML = '';
    introPageIndex++;
    introLineIndex = 0;
    introCharIndex = 0;
    el.style.opacity = '1';
    setTimeout(() => typeLine(), 300);
  }, 450);
}

function showContinueBtn() {
  const el = document.getElementById('intro-text');
  const wrapper = document.getElementById('intro-wrapper');

  const btn = document.createElement('button');
  btn.className = 'continue-btn';
  btn.textContent = '▸ continue';
  btn.id = 'continue-btn';
  btn.onclick = function() {
    btn.remove();
    introLineIndex++;
    typeLine();
  };
  el.appendChild(btn);
  wrapper.scrollTop = wrapper.scrollHeight;
}

function showFinalPrompt() {
  const el = document.getElementById('intro-text');
  const wrapper = document.getElementById('intro-wrapper');

  const cont = document.createElement('div');
  cont.style.cssText = 'margin-top:1.5rem; text-align:center;';
  cont.innerHTML = '<button class="menu-item" onclick="goToCircles()" style="font-size:0.55rem; color:#888">▸ EXPLORE ALL KNOWLEDGE ▸</button>';
  el.appendChild(cont);
  wrapper.scrollTop = wrapper.scrollHeight;
}

// CIRCLES
// ═══════════════════════════════════════
function getExpandedSizes(activeIdx) {
  const sizes = [];
  const activeSize = 72;
  const outerCount = activeIdx;
  for (let i = 0; i < DISCIPLINES.length; i++) {
    if (i < activeIdx) {
      const outerBand = (100 - activeSize) / (outerCount + 1);
      sizes.push(100 - outerBand * (activeIdx - i));
    } else if (i === activeIdx) {
      sizes.push(activeSize);
    } else {
      sizes.push(0);
    }
  }
  return sizes;
}

// Label angles: fan from -36° to +36° (Philosophy at top-right, History at bottom-right)
const LABEL_ANGLES = DISCIPLINES.map((_, i) => (-36 + i * 12) * Math.PI / 180);

function buildRings() {
  const container = document.getElementById('circles-container');
  DISCIPLINES.forEach((d, i) => {
    const ring = document.createElement('div');
    ring.className = 'ring';
    ring.id = 'ring-' + i;
    ring.style.width = d.pct + '%';
    ring.style.height = d.pct + '%';
    ring.style.backgroundColor = d.bg;
    ring.style.border = '2px solid ' + d.color;
    ring.style.zIndex = i;

    const detail = document.createElement('div');
    detail.className = 'detail-content';
    detail.id = 'detail-' + i;
    ring.appendChild(detail);

    container.appendChild(ring);

    ring.addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeIndex === i) return;
      if (activeIndex >= 0 && i > activeIndex) return;
      openDiscipline(i);
    });
  });
}

function buildExternalLabels() {
  const app = document.querySelector('.app');

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.id = 'labels-svg';
  app.appendChild(svg);

  DISCIPLINES.forEach((d, i) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.id = 'connector-' + i;

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.classList.add('connector-line');
    line.setAttribute('stroke', d.color);
    g.appendChild(line);

    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.classList.add('connector-dot');
    dot.setAttribute('r', '2');
    dot.setAttribute('fill', d.color);
    g.appendChild(dot);

    svg.appendChild(g);

    const label = document.createElement('span');
    label.className = 'external-label';
    label.id = 'ext-label-' + i;
    label.textContent = d.name;
    label.style.color = d.color;
    app.appendChild(label);
  });

  updateLabelPositions(null);
}

function updateLabelPositions(expandedSizes) {
  const container = document.getElementById('circles-container');
  const app = document.querySelector('.app');
  const cRect = container.getBoundingClientRect();
  const aRect = app.getBoundingClientRect();

  const cx = cRect.left + cRect.width / 2 - aRect.left;
  const cy = cRect.top + cRect.height / 2 - aRect.top;
  const containerSize = cRect.width;
  const labelGap = 15;

  DISCIPLINES.forEach((d, i) => {
    const pct = expandedSizes ? expandedSizes[i] : d.pct;
    const angle = LABEL_ANGLES[i];
    const radius = pct / 100 * containerSize / 2;

    const anchorX = cx + radius * Math.cos(angle);
    const anchorY = cy - radius * Math.sin(angle);

    const labelX = cx + (containerSize / 2) + labelGap;
    const labelY = anchorY;

    const g = document.getElementById('connector-' + i);
    const line = g.querySelector('line');
    const dot = g.querySelector('circle');

    line.setAttribute('x1', anchorX);
    line.setAttribute('y1', anchorY);
    line.setAttribute('x2', labelX);
    line.setAttribute('y2', labelY);

    dot.setAttribute('cx', anchorX);
    dot.setAttribute('cy', anchorY);

    const label = document.getElementById('ext-label-' + i);
    label.style.left = labelX + 'px';
    label.style.top = labelY + 'px';
    label.style.transform = 'translateY(-50%)';

    const isHidden = pct === 0;
    const isActive = expandedSizes && activeIndex === i;
    const shouldHide = isHidden || isActive;

    label.style.opacity = shouldHide ? '0' : '1';
    line.style.opacity = shouldHide ? '0' : '0.4';
    dot.style.opacity = shouldHide ? '0' : '0.5';
  });
}

function openDiscipline(index) {
  activeIndex = index;
  const d = DISCIPLINES[index];
  const sizes = getExpandedSizes(index);

  document.getElementById('circles-container').classList.add('expanded');

    const ring = document.getElementById('ring-' + i);

      ring.style.width = '0%';
      ring.style.height = '0%';

      ring.style.width = sizes[i] + '%';
      ring.style.height = sizes[i] + '%';

          </button>
        </div>

      `;
      setTimeout(() => detail.classList.add('visible'), 100);
      loadQuestions(d.id);
    } else if (i < index) {
      ring.classList.remove('active');
      ring.style.cursor = 'pointer';
    }
  });

  updateLabelPositions(sizes);
  setTimeout(() => updateLabelPositions(sizes), 750);
}

function closeDiscipline() {
  if (activeIndex < 0) return;
  const detail = document.getElementById('detail-' + activeIndex);
  detail.classList.remove('visible');

  document.getElementById('circles-container').classList.remove('expanded');
  document.getElementById('app-header').classList.remove('hidden');

  DISCIPLINES.forEach((d, i) => {
    const ring = document.getElementById('ring-' + i);
    ring.classList.remove('active', 'inner-hidden');
    ring.style.width = d.pct + '%';
    ring.style.height = d.pct + '%';
    ring.style.cursor = 'pointer';
  });

  setTimeout(() => { detail.innerHTML = ''; }, 500);
  activeIndex = -1;

  updateLabelPositions(null);
  setTimeout(() => updateLabelPositions(null), 750);
}

// ═══════════════════════════════════════
// QUESTIONS
// ═══════════════════════════════════════
function pickRandomQuestions(disciplineId, count = 3) {
  const pool = QUESTIONS_DB[disciplineId];
  if (!pool) return [];
  const used = usedQuestions[disciplineId];
  if (used.size >= pool.length - count) used.clear();
  const available = pool.filter((_, i) => !used.has(i));
  const picked = [], copy = [...available];
  for (let i = 0; i < Math.min(count, copy.length); i++) {
    const idx = Math.floor(Math.random() * copy.length);
    const item = copy.splice(idx, 1)[0];
    used.add(pool.indexOf(item));
    picked.push(item);
  }
  return picked;
}

function renderCards(questions, d) {
  return questions.map(q => `
    <div class="question-card">
      <a class="q-text" href="https://en.wikipedia.org/wiki/${q.article}" target="_blank" rel="noopener" style="color:${d.text}" onclick="event.stopPropagation()">
        ${q.question}<svg class="q-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
    </div>
  `).join('');
}

function loadQuestions(disciplineId) {
  const d = DISCIPLINES.find(x => x.id === disciplineId);
  const picked = pickRandomQuestions(disciplineId);
  if (!picked.length) return;
  const list = document.getElementById('questions-list');
  if (list) list.innerHTML = renderCards(picked, d);
}

function refreshQuestions() {
  if (activeIndex >= 0) loadQuestions(DISCIPLINES[activeIndex].id);
}

// ═══════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (activeIndex >= 0) closeDiscipline();
    else if (document.getElementById('intro').classList.contains('active')) goToLanding();
    else if (document.getElementById('circles-screen').classList.contains('active')) goToLanding();
  }
});

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
buildRings();
buildExternalLabels();
window.addEventListener('resize', () => {
  const sizes = activeIndex >= 0 ? getExpandedSizes(activeIndex) : null;
  updateLabelPositions(sizes);
});
</script>
